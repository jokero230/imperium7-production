name: Deploy to server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${DEPLOY_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${SERVER_HOST}" >> ~/.ssh/known_hosts

      - name: Deploy FRONTEND
        run: |
          ssh -i ~/.ssh/id_ed25519 ${SERVER_USER}@${SERVER_HOST} "
            cd ${FRONTEND_PATH} || exit 1
            git pull
            npm ci || true
            npm run build || true
            pm2 restart frontend || true
          "

      - name: Deploy BACKEND
        run: |
          ssh -i ~/.ssh/id_ed25519 ${SERVER_USER}@${SERVER_HOST} "
            cd ${BACKEND_PATH} || exit 1
            git pull
            npm ci || true
            npm run build || true
            pm2 restart backend || true
          "

      - name: Deploy TRIADA
        run: |
          ssh -i ~/.ssh/id_ed25519 ${SERVER_USER}@${SERVER_HOST} "
            cd ${TRIADA_PATH} || exit 1
            git pull
            npm ci || true
            npm run build || true
            pm2 restart triada || true
          "

      - name: Health check
        run: |
          curl -I https://${SERVER_HOST} || true
